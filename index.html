<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FORMULARIO SENA V1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>FROMULARIO SENA V1</h1>
  <h3>GRACIAS POR DEJAR SUS DATOS</h3>

  <div class="form-container">
    <form id="form">
      <label for="name">Nombre</label>
      <input type="text" id="name" placeholder="Por favor ingrese su nombre." required>

           <label for="email">Correo</label>
          <input type="email" id="email" placeholder="Por favor ingrese su correo." required>

      <label for="age">Edad</label>
      <input type="number" id="age" placeholder="Por favor ingrese su edad." required>

      <label for="car-question">¿Planeas comprar un auto nuevo en los próximos 5 años?</label>
      <select id="car-question" required>
        <option>selecciones un opcion</option>
        <option>si</option>
        <option>No</option>
        <option>Tal vez</option>
      </select>

      <label for="brand">¿Cual es su carro favorito?</label>
      <select id="brand" required>
        <option>Seleccione una opcion</option>
        <option>Toyota</option>
        <option>Chevrolet</option>
        <option>Ford</option>
        <option>BMW</option>
      </select>

      <label for="transport">¿Que tipo de medio de transporte posee?</label>
      <select id="transport" required>
        <option>Seleccione una opcion</option>
        <option>Carro</option>
        <option>Bote</option>
        <option>Bicicleta</option>
        <option>Moto</option>
        <option>Ninguna</option>
      </select>

      <label for="comments">¿Tiene alguna pregunta o comentarios?</label>
      <textarea id="comments" placeholder="Por favor ingreselos."></textarea>

      <input type="submit" value="Enviar">
    </form>
    <div id="modal-success" class="modal hidden">
      <div class="modal-content">
        <h2>Datos enviados con exito</h2>
        <button id="close-model">CERRAR</button>
      </div>
    </div>

  </div>
</body>
<script type="module" src="main.js"></script>
</html>
